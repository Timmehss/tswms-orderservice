apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: dapr-system-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector: {} 
  namespaceSelector:
    matchNames:
      - dapr-system
  podMetricsEndpoints:
  - targetPort: 9090
    path: /metrics 
    interval: 15s